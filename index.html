body {

.header {

}

.container {

    padding: 30px;

    box-shadow: 0 0 12px rgba(0,0,0,0.12);
}

h1, h2 {

}

.header h1 {
    color: white;

}

input[type="text"] {

}

button {
    background: #16813d;

    border: none;

}

button:hover {

}

.option {

.correct {

}

.pass {

</style>
</head>

<body>

<div class="container">

<!-- LOGIN -->

<div id="loginPage">

<label>Candidate Name</label>
<input type="text" id="candidateName" placeholder="Enter your full name">

<label>Employee / Candidate ID</label>
<input type="text" id="candidateID" placeholder="Enter your ID">

<p><strong>Number of Questions:</strong> 40</p>
<p><strong>Pass Mark:</strong> 80%</p>
<p><strong>Timer:</strong> No time limit</p>

<button onclick="startExam()">Start Examination</button>

</div>


<!-- EXAM -->

<div id="examPage" class="hidden">

<div class="progress" id="progress"></div>

<h2 id="question"></h2>

<div id="options"></div>

<br>

<button onclick="nextQuestion()">Next Question</button>

</div>


<!-- RESULTS -->

<div id="resultPage" class="hidden result">

<h2>Examination Result</h2>

<p id="candidateResult"></p>

<h3 id="scoreResult"></h3>

<h3 id="percentageResult"></h3>

<p id="statusResult"></p>

<button onclick="showReview()">Review Answers</button>

let questions = [];
let currentQuestion = 0;
let score = 0;
let selectedAnswer = null;
let candidateAnswers = [];


/* SHUFFLE ARRAY */

function shuffle(array) {

    const newArray = [...array];

    for (let i = newArray.length - 1; i > 0; i--) {

        const j = Math.floor(Math.random() * (i + 1));

        [newArray[i], newArray[j]] =
        [newArray[j], newArray[i]];

    }

    return newArray;
}


/* SHUFFLE OPTIONS WHILE KEEPING CORRECT ANSWER */

function prepareQuestion(q) {

    const optionObjects = q.options.map((text, index) => ({
        text: text,
        correct: index === q.answer
    }));

    const shuffledOptions = shuffle(optionObjects);

    return {
        question: q.question,
        options: shuffledOptions.map(o => o.text),
        answer: shuffledOptions.findIndex(o => o.correct),
        explanation: q.explanation
    };
}


/* START EXAM */

function startExam() {

    const name =
    document.getElementById("candidateName").value.trim();

    const id =
    document.getElementById("candidateID").value.trim();

    if (!name || !id) {

        alert("Please enter Candidate Name and ID.");

        return;
    }

    const selectedQuestions =
        shuffle(questionBank).slice(0, QUESTIONS_PER_EXAM);

    questions =
        selectedQuestions.map(q => prepareQuestion(q));

    currentQuestion = 0;
    score = 0;
    candidateAnswers = [];

    document.getElementById("loginPage")
        .classList.add("hidden");

    document.getElementById("examPage")
        .classList.remove("hidden");

    showQuestion();
}


/* SHOW QUESTION */

function showQuestion() {

    selectedAnswer = null;

    const q = questions[currentQuestion];

    document.getElementById("progress").innerText =
        "Question " +
        (currentQuestion + 1) +
        " of " +
        questions.length;

    document.getElementById("question").innerText =
        q.question;

    const optionsDiv =
        document.getElementById("options");

    optionsDiv.innerHTML = "";

    q.options.forEach((option, index) => {

        const label =
            document.createElement("label");

        label.className = "option";

        label.innerHTML =
            `<input type="radio"
            name="answer"
            value="${index}"
            onchange="selectAnswer(${index})">
            <strong>${String.fromCharCode(65 + index)}.</strong>
            ${option}`;

        optionsDiv.appendChild(label);
    });
}


/* SELECT ANSWER */

function selectAnswer(index) {

    selectedAnswer = index;
}


/* NEXT QUESTION */

function nextQuestion() {

    if (selectedAnswer === null) {

        alert("Please select an answer.");

        return;
    }

    const q = questions[currentQuestion];

    const isCorrect =
        selectedAnswer === q.answer;

    if (isCorrect) {
        score++;
    }

    candidateAnswers.push({

        question: q.question,

        options: q.options,

        selected: selectedAnswer,

        correct: q.answer,

        explanation: q.explanation,
element: q.element,
topic: q.topic,
page: q.page,
        isCorrect: isCorrect
    });

    currentQuestion++;

    if (currentQuestion < questions.length) {

        showQuestion();

    } else {

        finishExam();
    }
}


/* FINISH EXAM */

function finishExam() {

    document.getElementById("examPage")
        .classList.add("hidden");

    document.getElementById("resultPage")
        .classList.remove("hidden");

    const name =
        document.getElementById("candidateName").value;

    const id =
        document.getElementById("candidateID").value;

    const percentage =
        Math.round((score / questions.length) * 100);

    document.getElementById("candidateResult").innerText =
        name + " | ID: " + id;

    document.getElementById("scoreResult").innerText =
        "Score: " +
        score +
        " / " +
        questions.length;

    document.getElementById("percentageResult").innerText =
        "Percentage: " +
        percentage +
        "%";

    const statusElement =
        document.getElementById("statusResult");

    if (percentage >= PASS_MARK) {

        statusElement.innerText = "PASS";

        statusElement.className = "pass";

    } else {

        statusElement.innerText = "FAIL";

        statusElement.className = "fail";
    }
}


/* REVIEW ANSWERS */

function showReview() {

    document.getElementById("resultPage")
        .classList.add("hidden");

    document.getElementById("reviewPage")
        .classList.remove("hidden");

    const review =
        document.getElementById("reviewContent");

    review.innerHTML = "";

    candidateAnswers.forEach((item, index) => {

        const div =
            document.createElement("div");

        div.className = "review-item";

        const selectedLetter =
            String.fromCharCode(65 + item.selected);

        const correctLetter =
            String.fromCharCode(65 + item.correct);

        div.innerHTML = `

        <h3>Question ${index + 1}</h3>

        <p><strong>${item.question}</strong></p>

        <p class="${item.isCorrect ? 'correct' : 'incorrect'}">

        Your Answer:
        ${selectedLetter}.
        ${item.options[item.selected]}

        ${item.isCorrect ? ' ✅' : ' ❌'}

        </p>

        ${
            !item.isCorrect
            ?
            `<p class="correct">
            Correct Answer:
            ${correctLetter}.
            ${item.options[item.correct]}
            </p>`
            :
            ""
        }

       <div class="explanation">

<strong>Explanation:</strong><br>
${item.explanation}

<br><br>

<strong>📘 Reference:</strong><br>
${item.element || "Reference not added yet"}<br>
${item.topic || ""}<br>
${item.page || ""}

</div>
        `;

        review.appendChild(div);
    });
}


/* BACK TO RESULTS */

function backToResult() {

    document.getElementById("reviewPage")
        .classList.add("hidden");

    document.getElementById("resultPage")
        .classList.remove("hidden");
}

</script>
