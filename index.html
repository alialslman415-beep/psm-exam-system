<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PSM Examination System</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f4f6f8;
    margin: 0;
    padding: 0;
}

.header {
    background: #123b63;
    color: white;
    padding: 20px;
    text-align: center;
}

.container {
    max-width: 850px;
    margin: 30px auto;
    background: white;
    padding: 30px;
    border-radius: 12px;
    box-shadow: 0 0 12px rgba(0,0,0,0.1);
}

h1, h2 {
    color: #123b63;
}

.header h1 {
    color: white;
}

input {
    width: 100%;
    padding: 12px;
    margin: 8px 0 18px;
    box-sizing: border-box;
    font-size: 16px;
}

button {
    background: #16813d;
    color: white;
    border: none;
    padding: 13px 25px;
    border-radius: 7px;
    cursor: pointer;
    font-size: 16px;
}

button:hover {
    background: #10652f;
}

.option {
    display: block;
    padding: 12px;
    margin: 10px 0;
    background: #eef2f5;
    border-radius: 7px;
    cursor: pointer;
}

.option:hover {
    background: #dfe7ed;
}

.timer {
    font-weight: bold;
    color: #b00020;
    text-align: right;
    font-size: 18px;
}

.progress {
    margin-bottom: 20px;
    font-weight: bold;
}

.hidden {
    display: none;
}

.result {
    text-align: center;
    font-size: 20px;
}
</style>
</head>

<body>

<div class="header">
    <h1>Process Safety Management</h1>
    <p>Training & Examination System</p>
</div>

<div class="container">

<div id="loginPage">

    <h2>Candidate Information</h2>

    <label>Candidate Name</label>
    <input type="text" id="candidateName" placeholder="Enter your full name">

    <label>Employee / Candidate ID</label>
    <input type="text" id="candidateID" placeholder="Enter your ID">

    <button onclick="startExam()">Start Examination</button>

</div>

<div id="examPage" class="hidden">

    <div class="timer">
        Time Remaining:
        <span id="timer">10:00</span>
    </div>

    <div class="progress" id="progress"></div>

    <h2 id="question"></h2>

    <div id="options"></div>

    <br>

    <button onclick="nextQuestion()">Next Question</button>

</div>

<div id="resultPage" class="hidden result">

    <h2>Examination Result</h2>

    <p id="candidateResult"></p>

    <p id="scoreResult"></p>

    <p id="percentageResult"></p>

    <p id="statusResult"></p>

</div>

</div>

<script>

const questionBank = [

{
question: "Process safety mainly focuses on which type of risk?",
options: [
"Frequent events with minor consequences",
"Rare events with potentially severe consequences",
"Office ergonomic risks",
"Routine personal injuries only"
],
answer: 1
},

{
question: "Which technique systematically applies guide words to process parameters?",
options: [
"HAZOP",
"Toolbox Talk",
"Inspection",
"Job Observation"
],
answer: 0
},

{
question: "Which action is most important before implementing a significant process modification?",
options: [
"Management of Change review",
"Increase production immediately",
"Remove alarms",
"Delay documentation"
],
answer: 0
},

{
question: "Which device provides an independent layer of protection against tank overfilling?",
options: [
"Independent high-level shutdown",
"Normal level display only",
"Operator logbook",
"Warning sign"
],
answer: 0
},

{
question: "What is a key purpose of effective shift handover?",
options: [
"Transfer safety-critical information",
"Reduce maintenance",
"Replace permits",
"Remove operating limits"
],
answer: 0
}

];

let questions = [];
let currentQuestion = 0;
let score = 0;
let selectedAnswer = null;

let timeLeft = 600;
let timerInterval;

function shuffle(array) {

    for (let i = array.length - 1; i > 0; i--) {

        const j = Math.floor(Math.random() * (i + 1));

        [array[i], array[j]] =
        [array[j], array[i]];

    }

    return array;

}

function startExam() {

    const name =
    document.getElementById("candidateName").value.trim();

    const id =
    document.getElementById("candidateID").value.trim();

    if (!name || !id) {

        alert("Please enter Candidate Name and ID.");

        return;

    }

    questions = shuffle([...questionBank]);

    document.getElementById("loginPage")
    .classList.add("hidden");

    document.getElementById("examPage")
    .classList.remove("hidden");

    showQuestion();

    timerInterval =
    setInterval(updateTimer, 1000);

}

function showQuestion() {

    selectedAnswer = null;

    const q =
    questions[currentQuestion];

    document.getElementById("progress").innerText =
    "Question " +
    (currentQuestion + 1) +
    " of " +
    questions.length;

    document.getElementById("question").innerText =
    q.question;

    const optionsDiv =
    document.getElementById("options");

    optionsDiv.innerHTML = "";

    q.options.forEach((option, index) => {

        const label =
        document.createElement("label");

        label.className = "option";

        label.innerHTML =
        `<input type="radio"
        name="answer"
        value="${index}"
        onchange="selectAnswer(${index})">
        ${String.fromCharCode(65 + index)}. ${option}`;

        optionsDiv.appendChild(label);

    });

}

function selectAnswer(index) {

    selectedAnswer = index;

}

function nextQuestion() {

    if (selectedAnswer === null) {

        alert("Please select an answer.");

        return;

    }

    if (
        selectedAnswer ===
        questions[currentQuestion].answer
    ) {

        score++;

    }

    currentQuestion++;

    if (
        currentQuestion <
        questions.length
    ) {

        showQuestion();

    } else {

        finishExam();

    }

}

function updateTimer() {

    timeLeft--;

    const minutes =
    Math.floor(timeLeft / 60);

    const seconds =
    timeLeft % 60;

    document.getElementById("timer").innerText =
    String(minutes).padStart(2,"0")
    + ":" +
    String(seconds).padStart(2,"0");

    if (timeLeft <= 0) {

        finishExam();

    }

}

function finishExam() {

    clearInterval(timerInterval);

    document.getElementById("examPage")
    .classList.add("hidden");

    document.getElementById("resultPage")
    .classList.remove("hidden");

    const name =
    document.getElementById("candidateName").value;

    const id =
    document.getElementById("candidateID").value;

    const percentage =
    Math.round(
        (score / questions.length) * 100
    );

    document.getElementById("candidateResult").innerText =
    name + " | ID: " + id;

    document.getElementById("scoreResult").innerText =
    "Score: " +
    score +
    " / " +
    questions.length;

    document.getElementById("percentageResult").innerText =
    "Percentage: " +
    percentage +
    "%";

    const status =
    percentage >= 80
    ? "PASS"
    : "FAIL";

    document.getElementById("statusResult").innerText =
    "Result: " + status;

}

</script>

</body>
</html>
